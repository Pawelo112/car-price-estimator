<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Auto Price Predictor</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet">
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
    rel="stylesheet">
  <style>
    /* gradient background of the whole page */
    body {
      background: linear-gradient(135deg, #0d1b2a 0%, #000000 100%);
    }

    /* Form card and result box: semi-transparent with neon outline */
    .card, .result-box {
      background: rgba(10, 12, 18, 0.85);
      border: 2px solid rgba(0, 255, 255, 0.6);
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.4), 0 0 40px rgba(255, 0, 255, 0.3);
    }

    /* Icons and labels: electric blue */
    .form-label i {
      color: #00ffff;
    }

    /* Headlines */
    h1.card-title, h1.display-5 {
      color: #ff00ff; /* neon magenta */
      text-shadow: 0 0 8px rgba(255, 0, 255, 0.8), 0 0 16px rgba(255, 0, 255, 0.6);
    }

    /* Calculate button: blue → magenta gradient + glow */
    .btn-calc {
      background: linear-gradient(90deg, #00ffff 0%, #ff00ff 100%);
      color: #fff;
      border: none;
      box-shadow: 0 4px 12px rgba(0, 255, 255, 0.6), 0 4px 20px rgba(255, 0, 255, 0.6);
    }

    /* New calculation button (result.html) – reverse gradient */
    .btn-again {
      background: linear-gradient(90deg, #ff00ff 0%, #00ffff 100%);
      color: #fff;
      border: none;
      box-shadow: 0 4px 12px rgba(255, 0, 255, 0.6), 0 4px 20px rgba(0, 255, 255, 0.6);
    }

    /* Color input field – blue glow on focus */
    input[name="color"]:focus {
      box-shadow: 0 0 8px rgba(0, 255, 255, 0.8), 0 0 16px rgba(0, 255, 255, 0.6);
      border-color: #00ffff;
    }

    .form-label {
      color: #ffffff !important;
    }

    .card {
      background: rgba(20, 25, 30, 0.9);
    }
  </style>
</head>
<body>
  <div class="container py-5">
    <div class="card mx-auto p-4" style="max-width: 600px;">
      <div class="card-body">
        <h1 class="card-title text-center mb-4 text-indigo-600">
          <i class="bi bi-speedometer2"></i> Price Prediction
        </h1>
        <form action="{{ url_for('predict') }}" method="post">
          <!-- Levy -->
          <div class="mb-3">
            <label class="form-label">
              <i class="bi bi-receipt-cutoff"></i> Levy
            </label>
            <input name="levy" class="form-control" placeholder="e.g. 1500" value="0" required>
          </div>
          <!-- Manufacturer -->
          <div class="mb-3">
            <label class="form-label">
              <i class="bi bi-building"></i> Manufacturer
            </label>
            <input name="manufacturer" class="form-control" placeholder="e.g. Toyota" required>
          </div>
          <!-- Model, year & mileage -->
          <div class="mb-3 row g-2">
            <div class="col-6">
              <label class="form-label"><i class="bi bi-car-front"></i> Model</label>
              <input name="model" class="form-control" placeholder="e.g. Camry" required>
            </div>
            <div class="col-3">
              <label class="form-label"><i class="bi bi-calendar"></i> Year</label>
              <input name="prod_year" type="number" class="form-control" placeholder="YYYY" required>
            </div>
            <div class="col-3">
              <label class="form-label"><i class="bi bi-speedometer"></i> Mileage</label>
              <input name="mileage" class="form-control" placeholder="km" required>
            </div>
          </div>
          <!-- Category & Fuel -->
          <div class="mb-3 row g-2">
            <div class="col-6">
              <label class="form-label"><i class="bi bi-tag"></i> Category</label>
              <select name="category" class="form-select" required>
                <option>Sedan</option><option>Jeep</option><option>Hatchback</option>
                <option>Minivan</option><option>Coupe</option><option>Universal</option>
                <option>Microbus</option><option>Goods wagon</option><option>Pickup</option>
                <option>Cabriolet</option>
              </select>
            </div>
            <div class="col-6">
              <label class="form-label"><i class="bi bi-fuel-pump"></i> Fuel Type</label>
              <select name="fuel_type" class="form-select" required>
                <option>Petrol</option><option>Diesel</option><option>Hybrid</option>
                <option>LPG</option><option>CNG</option><option>Plug-in Hybrid</option>
                <option>Hydrogen</option>
              </select>
            </div>
          </div>
          <!-- Engine & Cylinders -->
          <div class="mb-3 row g-2">
            <div class="col-6">
              <label class="form-label"><i class="bi bi-cpu"></i> Engine Volume</label>
              <input name="engine_volume" class="form-control" placeholder="L" required>
            </div>
            <div class="col-3">
              <label class="form-label"><i class="bi bi-droplet-half"></i> Cylinders</label>
              <input name="cylinders" type="number" class="form-control" value="4" required>
            </div>
            <div class="col-3">
              <label class="form-label"><i class="bi bi-airplane-engines"></i> Airbags</label>
              <input name="airbags" type="number" class="form-control" value="2" required>
            </div>
          </div>
          <!-- Doors & Leather -->
          <div class="mb-3 row g-2">
            <div class="col-6">
              <label class="form-label"><i class="bi bi-door-open"></i> Doors</label>
              <select name="doors" class="form-select" required>
                <option>02-Mar</option><option>04-May</option><option>>5</option>
              </select>
            </div>
            <div class="col-6">
              <label class="form-label"><i class="bi bi-palette"></i> Leather Interior</label>
              <select name="leather_interior" class="form-select" required>
                <option>Yes</option><option>No</option>
              </select>
            </div>
          </div>
          <!-- Gear, Drive, Wheel -->
          <div class="mb-3 row g-2">
            <div class="col-4">
              <label class="form-label"><i class="bi bi-gear"></i> Gear Box</label>
              <select name="gear_box_type" class="form-select" required>
                <option>Automatic</option><option>Tiptronic</option>
                <option>Manual</option><option>Variator</option>
              </select>
            </div>
            <div class="col-4">
              <label class="form-label"><i class="bi bi-controller"></i> Drive Wheels</label>
              <select name="drive_wheels" class="form-select" required>
                <option>Front</option><option>4x4</option><option>Rear</option>
              </select>
            </div>
            <div class="col-4">
              <label class="form-label"><i class="bi bi-sign-turn-slight-right"></i> Wheel</label>
              <select name="wheel" class="form-select" required>
                <option>Left wheel</option><option>Right-hand drive</option>
              </select>
            </div>
          </div>
          <!-- Color in a separate row, centered -->
          <div class="row mb-4 justify-content-center">
            <div class="col-8 col-md-6 mx-auto text-center">
              <label class="form-label"><i class="bi bi-brush"></i> Color</label>
              <input name="color" class="form-control" placeholder="e.g. Red" required>
            </div>
          </div>
          <div class="d-grid">
            <button type="submit" class="btn btn-calc btn-lg text-white">
              <i class="bi bi-calculator"></i> Calculate Value
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
